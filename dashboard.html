<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ระบบบริหารจัดการ</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/header.css">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        if (
            localStorage.getItem('color-theme') === 'dark' ||
            (!('color-theme' in localStorage) &&
                window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            800: '#075985',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body id="appBody"
      data-title="ภาพรวมระบบ"
      data-subtitle="ข้อมูลสรุปการทำงานและสถานะปัจจุบัน"
      class="bg-slate-50 dark:bg-slate-900 transition-theme font-sans text-slate-700 dark:text-slate-300 hidden m-0">

    <div id="layoutRoot" class="flex h-screen overflow-hidden">

        <!-- เนื้อหาหน้านี้จะถูกวางต่อท้าย header ที่โหลดเข้ามา -->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                document.addEventListener('headerLoaded', () => {});
            });
        </script>

    </div>

    <script src="assets/js/header.js"></script>
    <script src="assets/js/dashboard.js"></script>
</body>
</html>
